  --font:"SP Noto","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --num:"SP Barlow","DIN Condensed","Arial Narrow",var(--font);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 2px 12px rgba(31,35,41,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--tx);background:#E9EBF0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
button:focus-visible{outline:3px solid var(--g);outline-offset:2px;border-radius:10px}
svg{display:block}
.num{font-family:var(--num);font-weight:600;letter-spacing:.2px;font-variant-numeric:tabular-nums}

/* ---------------- stage + presenter guide ---------------- */
.stage{position:relative;overflow:hidden;min-height:100%;height:100vh;display:flex;gap:48px;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 15% 15%,#fff 0,transparent 45%),linear-gradient(135deg,#EEF1F5,#E3E7EE)}
.guide{width:330px;flex:none;max-height:calc(100vh - 48px);overflow-y:auto;scrollbar-width:thin;padding:4px 6px 4px 2px}
.glogo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.glogo .mark{width:44px}
.glogo b{font-size:24px;font-weight:800;letter-spacing:-.3px}
.glogo span{display:block;font-size:13px;color:var(--tx2);font-weight:500}
.gsub{color:var(--tx2);font-size:14px;line-height:1.55;margin:8px 0 16px}
.gstep{position:relative;padding:12px 14px 12px 50px;margin-bottom:10px;border-radius:14px;background:#fff;box-shadow:var(--shadow)}
.gstep .gn{position:absolute;left:13px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.gstep b{display:block;font-size:15px;margin-bottom:2px}
.gstep p{font-size:13px;color:var(--tx2);line-height:1.5;margin-bottom:8px}
.gbtns{display:flex;flex-wrap:wrap;gap:6px}
.gbtn{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--pill);color:var(--tx);transition:transform .15s var(--spring),background .15s}
.gbtn:hover{transform:translateY(-2px);background:var(--gl)}
.gbtn.pk{background:var(--g);color:#fff}
.gbtn.warn{background:transparent;border:1.5px solid #E6B8BA;color:#B42318}
.gfoot{margin-top:14px}
.gnote{font-size:12.5px;color:var(--tx2);margin-top:12px;line-height:1.55}

/* ---------------- phone ---------------- */
.phone{position:relative;width:390px;height:812px;border-radius:48px;background:var(--bg);
  box-shadow:0 0 0 10px #101216,0 0 0 12px #3B3F48,0 40px 80px rgba(20,24,34,.35);overflow:hidden;flex:none;isolation:isolate}
.phone.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.in-fwd{animation:inF .4s cubic-bezier(.2,.9,.3,1) both}.screen.out-fwd{animation:outF .32s ease-in both}
.screen.in-back{animation:inB .4s cubic-bezier(.2,.9,.3,1) both}.screen.out-back{animation:outB .32s ease-in both}
.screen.in-fade{animation:inFade .3s ease-out both}.screen.out-fade{animation:outFade .2s ease-in both}
@keyframes inF{from{transform:translateX(100%)}}@keyframes outF{to{transform:translateX(-30%);opacity:.4}}
@keyframes inB{from{transform:translateX(-30%);opacity:.4}}@keyframes outB{to{transform:translateX(100%)}}
@keyframes inFade{from{opacity:0;transform:translateY(8px)}}@keyframes outFade{to{opacity:0}}
.screen.out-back{z-index:2}
.status{height:46px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 6px 36px;font-size:15px;font-weight:600}
.status .sig{display:flex;gap:6px;align-items:center}
.status .sig svg{height:12px;width:auto}
.status .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.status .bat:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1.5px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:0 16px 20px}

/* green header (home) */
.ghead{background:var(--g);color:#fff}
.ghead .hbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px}
.ghead .av{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,.8);overflow:hidden;padding:2px 3px 0}
.wordmark{font-size:27px;letter-spacing:.2px;font-weight:700}
.wordmark b{font-weight:700}
.ghead .acts{display:flex;gap:14px}
.ghead .acts svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}

/* weather hero */
.sky{position:relative;padding:14px 18px 18px;color:#fff;overflow:hidden;
  background:linear-gradient(180deg,#4F6E93 0%,#6F8FB3 45%,#A4BCD6 100%)}
.sky .cl{position:absolute;border-radius:50%;background:#fff;filter:blur(22px);opacity:.5;animation:drift 22s linear infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.sky>*:not(.cl){position:relative}
.sky .loc{font-size:15px;font-weight:600;display:flex;gap:14px}
.sky .msg{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
.sky .msg p{font-size:18px;font-weight:600;line-height:1.45;max-width:220px}
.sky .temp{display:flex;align-items:center;gap:8px;font-size:38px;font-weight:500}
.sky .temp sup{font-size:14px;vertical-align:22px}
.sky .temp svg{width:50px}
.glass{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);padding:12px 14px}
.glass div{font-size:13px;color:rgba(255,255,255,.85)}
.glass div:nth-child(2){text-align:center}.glass div:nth-child(3){text-align:right}
.glass b{display:block;font-family:var(--num);font-size:26px;font-weight:600;color:#fff;margin:4px 0 0;line-height:1.1}
.glass small{font-size:12px}
.gbtnw{display:block;width:100%;margin-top:14px;padding:13px;border-radius:26px;background:var(--g);color:#fff;font-weight:700;font-size:16px;text-align:center}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px 0}
.tile{border-radius:12px;color:#fff;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:700;text-align:center;line-height:1.25;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile small{display:block;font-size:12.5px;font-weight:500;opacity:.85}
.tile .ti{width:66px;height:66px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.tile .ti i{width:50px;height:50px;border-radius:12px;display:grid;place-items:center}
.tile .ti svg{width:32px;height:32px}
.t-red{background:linear-gradient(180deg,var(--red),var(--red2))}.t-red .ti i{background:var(--red)}
.t-green{background:linear-gradient(180deg,#1AB350,var(--gd))}.t-green .ti i{background:var(--g)}
.t-yel{background:linear-gradient(180deg,var(--yel),var(--yel2))}.t-yel .ti i{background:var(--yel)}
.t-pur{background:linear-gradient(180deg,var(--pur),var(--pur2))}.t-pur .ti i{background:var(--pur)}

/* squad entry card on home */
.spcard{margin:12px 14px 16px;display:flex;gap:12px;align-items:center;width:calc(100% - 28px);background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.spcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--g)}
.spcard .mini-crew{display:flex;flex:none}.spcard .mini-crew div{width:30px;margin-right:-8px}
.spcard b{font-size:15.5px;display:flex;align-items:center;gap:6px}
.spcard p{font-size:13px;color:var(--tx2);margin-top:2px}
.newtag{font-size:10.5px;font-weight:700;color:#fff;background:var(--red);padding:1px 6px;border-radius:5px;line-height:1.5;animation:pulseTag 1.6s ease-in-out infinite}
@keyframes pulseTag{50%{transform:scale(1.1)}}
.chev{width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-left:auto}

/* white top bar */
.wbar{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:2px 8px 8px;background:#fff}
.wbar h1{font-size:18px;font-weight:700;text-align:center;letter-spacing:.3px}
.wbar button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.wbar svg{width:24px;height:24px;stroke:var(--tx);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* nav */
.nav{flex:none;display:flex;background:#fff;padding:6px 6px 22px;box-shadow:0 -1px 0 var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--tx);padding-top:4px;position:relative}
.nav button svg{width:26px;height:26px;stroke:var(--tx);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button .bub{width:26px;height:26px;display:grid;place-items:center;position:relative}
.nav button.on{color:var(--g)}
.nav button.on .bub{width:46px;height:46px;margin:-24px 0 -2px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px #fff,0 4px 12px rgba(29,185,84,.4);animation:bubUp .45s var(--spring)}
.nav button.on .bub svg{stroke:#fff;width:26px}
.nav button.sp .bub:after{content:"";position:absolute;top:-2px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.nav button.on.sp .bub:after{display:none}
@keyframes bubUp{from{transform:translateY(18px) scale(.4)}}

/* cards + bits */
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);position:relative}
.card.lb{border-left:3px solid var(--g)}
.ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ct b{font-size:16px}
.ct .more{font-size:13px;color:var(--tx2);display:flex;align-items:center}
.lbl{font-size:13.5px;color:var(--tx);display:flex;align-items:center;gap:6px}
.lbl:before{content:"";width:3px;height:12px;border-radius:2px;background:var(--g)}
.lbl.o:before{background:var(--o)}
.muted{color:var(--tx2);font-size:13px;line-height:1.5}
.btn{display:block;width:100%;padding:13px 16px;border-radius:26px;background:var(--g);color:#fff;font-weight:700;font-size:16px;text-align:center;transition:transform .1s,background .15s;box-shadow:0 4px 12px rgba(29,185,84,.25)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}
.btn.grey{background:var(--pill);color:var(--tx);box-shadow:none}
.btn.yel{background:var(--yel);color:#4A2D00;box-shadow:0 4px 12px rgba(240,128,10,.25)}
.btn[disabled]{background:#DADDE3;color:#fff;box-shadow:none;cursor:default}
.mini{padding:6px 14px;border-radius:16px;background:var(--g);color:#fff;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .1s}
.mini:active{transform:scale(.95)}
.mini.on{background:var(--gl);color:var(--g)}
.mini[disabled]{background:#E3E5EA;color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--g);padding:1px 6px;border-radius:4px;line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.h1{font-size:24px;font-weight:800;letter-spacing:.2px;line-height:1.3;margin:6px 0 8px}
.h2{font-size:17px;font-weight:700}
.center{text-align:center}

/* ---------- blobs ---------- */
.blob{overflow:visible;width:100%;height:auto}
.blob .bg{transform-box:view-box;transform-origin:50px 96px;animation:breathe 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.blob .eyes{transform-box:view-box;transform-origin:50px 54px;animation:blink 4.6s infinite;animation-delay:calc(var(--d,0s) * 3)}
.blob.wait .bg{animation:hop 1.15s ease-in-out infinite}
.blob.cheer .bg{animation:cheer .62s var(--spring) 3;animation-delay:var(--d,0s)}
.blob.sad .bg{animation:sag 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-11px) scale(.96,1.05)}62%{transform:translateY(0) scale(1.07,.93)}78%{transform:scale(.98,1.02)}}
@keyframes cheer{0%{transform:translateY(0) scale(1.1,.9)}40%{transform:translateY(-22px) scale(.93,1.08) rotate(-6deg)}75%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes sag{50%{transform:scale(1.04,.94) rotate(2deg)}}

/* ---------- squad hero (green, like the weather hero) ---------- */
.shero{position:relative;color:#fff;padding:14px 16px 16px;overflow:hidden;background:linear-gradient(180deg,#1DB954 0%,#15A548 60%,#0E8E3A 100%)}
.shero .rings{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.07)}
.shero .rings:after{content:"";position:absolute;inset:30px;border-radius:50%;border:22px solid rgba(255,255,255,.06)}
.shero>*{position:relative}
.sqname{font-size:20px;font-weight:800;letter-spacing:.3px}
.shero .sub{font-size:14px;opacity:.9;margin-top:2px}
.stagecrew{position:relative;height:118px;margin-top:2px}
.stagecrew .line{position:absolute;left:-16px;right:-16px;bottom:16px}
.stagecrew .line .beat{stroke-dasharray:46 460;stroke-dashoffset:506;animation:beat 3.2s linear infinite}
@keyframes beat{to{stroke-dashoffset:0}}
.mate{position:absolute;bottom:18px;width:58px;text-align:center}
.mate .nm{position:absolute;left:-8px;right:-8px;bottom:-18px;font-size:12px;font-weight:600}
.mate .tick{position:absolute;right:0;top:8px;width:19px;height:19px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:pop .4s var(--spring) both;animation-delay:var(--d,0s);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mate .tick svg{width:12px;stroke:var(--g);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(0)}}
.bubble{position:absolute;left:0;bottom:66px;background:#fff;color:var(--g);border-radius:12px 12px 12px 3px;padding:3px 9px;font-weight:700;font-size:13px;white-space:nowrap;transform-origin:0 100%;animation:wob 2.4s ease-in-out infinite;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(2deg) translateY(-2px)}}
.shero .glass{margin-top:16px}

/* week rings (like 日程) */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wd{font-size:13px;color:var(--tx);padding:6px 0 8px;border-radius:22px;position:relative}
.wd.today{background:var(--pill)}
.wd.today:after{content:"";position:absolute;left:50%;bottom:-6px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--g)}
.wd .rg{width:40px;height:40px;margin:6px auto 0;position:relative}
.wd .rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.wd .rg span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--tx)}
.seg{transition:stroke .3s}
.seg.fill{animation:segfill .8s cubic-bezier(.3,.9,.3,1) both;animation-delay:var(--d,0s)}
@keyframes segfill{from{stroke-dasharray:0 120}}
.rg.popdone{animation:ringpop .6s var(--spring) both;animation-delay:var(--d,0s)}
@keyframes ringpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.legend{display:flex;gap:14px;justify-content:flex-end;font-size:12px;color:var(--tx2);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* stats like 運動消耗 */
.stat2{display:flex;align-items:center;gap:14px}
.stat2 .s{flex:1}
.stat2 .s b{font-family:var(--num);font-size:30px;font-weight:600;margin-right:4px}
.stat2 .s small{font-size:13px;color:var(--tx2)}
.donut{width:76px;height:76px;flex:none}
.donut circle{transition:stroke-dashoffset 1s cubic-bezier(.3,.9,.3,1)}

/* plan card item */
.item{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0 12px}
.item .dot{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--tx3);flex:none}
.item .dot.on{background:var(--g);border-color:var(--g)}
.item b{font-size:14.5px;font-weight:600;display:block}
.item span{font-size:12.5px;color:var(--tx2)}
.donecard{display:flex;align-items:center;gap:10px;background:var(--gl);color:var(--gd);border-radius:10px;padding:12px;font-weight:700}
.donecard svg{width:22px;stroke:var(--g);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.duo .card{margin:0}
.bar{height:6px;border-radius:3px;background:var(--pill);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--o);border-radius:3px;transition:width .9s cubic-bezier(.3,.9,.3,1)}
.bar.g i{background:var(--g)}
.chest{width:52px}
.chest .lid{transform-box:view-box;transform-origin:6px 22px;transition:transform .5s var(--spring)}
.chest.open .lid{transform:rotate(-24deg)}
.chest.open{animation:jiggle 1.8s ease-in-out infinite}
@keyframes jiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}}
.aidbig{width:60px;transform:rotate(-6deg)}
.aidbig.used{opacity:.3;filter:grayscale(1)}

/* ---------- course list ---------- */
.tabsrow{display:flex;align-items:center;gap:0;padding:8px 0 10px;background:#fff}
.tabsrow .all{width:92px;text-align:center;color:var(--g);font-size:15px;position:relative;font-weight:600}
.tabsrow .all:before{content:"";position:absolute;left:0;top:-8px;bottom:-10px;width:3px;background:var(--g)}
.tabsrow .srt{display:flex;gap:12px;font-size:14.5px;color:var(--tx2);flex:1;padding-left:8px}
.tabsrow .srt b{color:var(--g);font-weight:600}
.tabsrow .flt{margin-right:14px;padding:6px 12px;border-radius:16px;background:var(--pill);font-size:13.5px;color:var(--tx);display:flex;gap:4px;align-items:center}
.tabsrow .flt svg{width:14px;height:14px;stroke:var(--tx);fill:none;stroke-width:2}
.split{display:flex;flex:1;min-height:0}
.side{width:92px;flex:none;background:#F4F6F4;overflow-y:auto;scrollbar-width:none}
.side button{display:block;width:100%;padding:16px 8px;font-size:14px;text-align:center;line-height:1.3;color:var(--tx);position:relative}
.side button.on{background:#fff;color:var(--g);font-weight:700}
.side button.on:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--g)}
.side .nw{display:block;width:max-content;margin:3px auto 0;font-size:10px;font-weight:700;color:#fff;background:var(--red);padding:0 5px;border-radius:4px}
.list{flex:1;overflow-y:auto;padding:8px 10px 20px;background:#fff;scrollbar-width:none}
.list::-webkit-scrollbar,.side::-webkit-scrollbar{display:none}
.lsec{font-size:13px;color:var(--tx2);margin:4px 2px 8px}
.ccard{display:block;width:100%;height:122px;border-radius:10px;overflow:hidden;position:relative;margin-bottom:10px;text-align:left;transition:transform .15s}
.ccard:active{transform:scale(.98)}
.studio{position:absolute;inset:0;width:100%;height:100%}
.ccard .fwrap{position:absolute;right:28px;bottom:30px;width:72px}
.ccard .tt{position:absolute;left:10px;right:104px;bottom:34px;line-height:1.3;color:#fff;font-weight:600;font-size:14.5px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.ccard .cchips{position:absolute;left:10px;right:10px;bottom:9px;display:flex;gap:5px;align-items:center}
.chipd{font-size:11.5px;color:#fff;background:rgba(20,22,30,.55);padding:2px 6px;border-radius:5px;white-space:nowrap}
.chipd.r{margin-left:auto}
.ccard .tag{position:absolute;top:8px;right:8px}

/* ---------- detail ---------- */
.dhero{position:relative;height:270px;flex:none;overflow:hidden}
.dhero .fwrap{position:absolute;left:50%;top:50px;width:118px;margin-left:-59px}
.dhero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 30%,transparent 55%,rgba(0,0,0,.45) 100%)}
.dhero .tt{position:absolute;left:18px;right:18px;bottom:34px;color:#fff;font-size:22px;font-weight:700;line-height:1.3}
.dhero .rb{position:absolute;top:52px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center}
.dhero .rb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stats3{display:flex;gap:10px;margin:-22px 0 12px;position:relative;overflow-x:auto;scrollbar-width:none;padding:0 2px 4px}
.stats3 .card{flex:0 0 138px;margin:0}
.stats3 b{font-family:var(--num);font-size:30px;font-weight:600;margin-right:4px}
.stats3 small{font-size:12.5px;color:var(--tx2)}
.stats3 p{font-size:12.5px;color:var(--tx2);margin-top:6px;line-height:1.45}
.dtabs{display:flex;justify-content:center;gap:44px;margin:6px 0 10px}
.dtabs button{font-size:16px;color:var(--tx);padding-bottom:8px;position:relative}
.dtabs button.on{color:var(--g);font-weight:700}
.dtabs button.on:after{content:"";position:absolute;left:50%;bottom:0;width:22px;height:4px;margin-left:-11px;border-radius:2px;background:var(--g)}
.steps li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.steps li span{width:22px;height:22px;border-radius:50%;background:var(--gl);color:var(--g);font-weight:700;font-size:12.5px;display:grid;place-items:center;flex:none}
.sqprog{display:flex;gap:6px}
.sqprog>div{flex:1;text-align:center;font-size:12px}
.sqprog .av{width:46px;margin:0 auto 2px;position:relative}
.sqprog .ok{position:absolute;right:-2px;bottom:4px;width:17px;height:17px;border-radius:50%;background:var(--g);display:grid;place-items:center;border:2px solid #fff}
.sqprog .ok svg{width:10px;stroke:#fff;stroke-width:3.4;fill:none}
.footbar{flex:none;background:#fff;padding:12px 16px 26px;box-shadow:0 -1px 0 var(--line)}

/* ---------- play ---------- */
.play{background:#0F1117;color:#fff;text-align:center}
.play .top{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.play .top button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.play .top svg{width:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.play .tt{font-size:16px;font-weight:600}
.pstage{position:relative;height:300px;margin:14px 16px 0;border-radius:16px;overflow:hidden}
.pstage .fwrap{position:absolute;left:50%;top:30px;width:200px;margin-left:-100px}
.pstage .lvl{position:absolute;left:12px;top:12px}
.pstage .buddy{position:absolute;right:10px;bottom:10px;width:62px;padding:4px;border-radius:12px;background:rgba(0,0,0,.25)}
.pstage .buddy span{display:block;font-size:10.5px;margin-top:-2px}
.clock{font-family:var(--num);font-size:60px;font-weight:600;letter-spacing:1px;line-height:1;margin-top:18px}
.scrub{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:14px 24px 0;position:relative}
.scrub i{position:absolute;left:0;top:0;bottom:0;background:var(--g);border-radius:2px;width:0}
.scrub i:after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff}
.cue{font-size:19px;font-weight:700;min-height:54px;margin-top:16px;padding:0 20px;line-height:1.4}
.cue.swap{animation:cueIn .45s var(--spring)}
@keyframes cueIn{from{transform:translateY(10px) scale(.9);opacity:0}}
.cuedots{display:flex;gap:6px;justify-content:center;margin:0 0 6px}
.cuedots i{width:24px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .3s}
.cuedots i.on{background:var(--g)}
.small{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:6px}

/* figure moves */
.fig{overflow:visible;width:100%;height:auto}
.fig .fb,.fig .al,.fig .ar,.fig .ll,.fig .lr,.fig .fe{transform-box:view-box}
.fig .fb{transform-origin:50px 112px}
.fig .al{transform-origin:15px 60px}.fig .ar{transform-origin:85px 60px}
.fig .ll{transform-origin:40px 96px}.fig .lr{transform-origin:60px 96px}
.fig .fe{transform-origin:50px 54px}
.fig .fb{animation:breathe 2.6s ease-in-out infinite}
.m-tilt .fb{animation:tilt 2.2s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}30%,60%{transform:rotate(-13deg)}}
.m-roll .al{animation:rollL 1.6s ease-in-out infinite}.m-roll .ar{animation:rollR 1.6s ease-in-out infinite}
@keyframes rollL{0%,100%{transform:rotate(0)}25%{transform:rotate(30deg)}50%{transform:rotate(55deg)}75%{transform:rotate(20deg)}}
@keyframes rollR{0%,100%{transform:rotate(0)}25%{transform:rotate(-30deg)}50%{transform:rotate(-55deg)}75%{transform:rotate(-20deg)}}
.m-reach .al{animation:upL 2.2s ease-in-out infinite}.m-reach .ar{animation:upR 2.2s ease-in-out infinite}.m-reach .fb{animation:stretch 2.2s ease-in-out infinite}
@keyframes upL{0%,100%{transform:rotate(20deg)}40%,70%{transform:rotate(152deg)}}
@keyframes upR{0%,100%{transform:rotate(-20deg)}40%,70%{transform:rotate(-152deg)}}
@keyframes stretch{0%,100%{transform:scale(1)}40%,70%{transform:scale(.95,1.08)}}
.m-far .fe{animation:far 2.4s ease-in-out infinite}
@keyframes far{0%,100%{transform:translate(0,0)}25%,75%{transform:translate(7px,-3px) scale(.8)}}
.m-close .fe{animation:close 2.6s ease-in-out infinite}
@keyframes close{0%,100%{transform:scaleY(1)}20%,80%{transform:scaleY(.08)}}
.m-breathe .fb{animation:deep 3.6s ease-in-out infinite}
@keyframes deep{0%,100%{transform:scale(1)}45%{transform:scale(1.1,1.06)}}
.m-twist .fb{animation:twist 1.8s ease-in-out infinite}
@keyframes twist{0%,100%{transform:skewX(0) scaleX(1)}25%{transform:skewX(-9deg) scaleX(.94)}75%{transform:skewX(9deg) scaleX(.94)}}
.m-hips .fb{animation:hips 1.6s ease-in-out infinite}
@keyframes hips{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(4deg)}75%{transform:translateX(8px) rotate(-4deg)}}
.m-calf .fb{animation:calf .9s ease-in-out infinite}
@keyframes calf{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) scale(.97,1.03)}}
.m-walk .ll{animation:legA .7s ease-in-out infinite}.m-walk .lr{animation:legB .7s ease-in-out infinite}
.m-walk .al{animation:legB .7s ease-in-out infinite}.m-walk .ar{animation:legA .7s ease-in-out infinite}
.m-walk .fb{animation:bob .35s ease-in-out infinite alternate}
@keyframes legA{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes legB{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes bob{to{transform:translateY(-4px)}}
.ground{stroke-dasharray:10 12;animation:scroll .7s linear infinite;opacity:0}
.m-walk .ground{opacity:1}
@keyframes scroll{to{stroke-dashoffset:22}}

/* ---------- done ---------- */
.okmark{width:76px;height:76px;margin:12px auto 8px;border-radius:50%;background:var(--g);display:grid;place-items:center;animation:okpop .6s var(--spring) both;box-shadow:0 8px 20px rgba(29,185,84,.35)}
.okmark svg{width:40px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .35s ease-out forwards}
@keyframes okpop{from{transform:scale(0)}}@keyframes draw{to{stroke-dashoffset:0}}
.gain{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.gain>div{background:#fff;border-radius:12px;padding:10px 4px;text-align:center;box-shadow:var(--shadow);animation:inFade .5s both}
.gain>div:nth-child(1){animation-delay:.5s}.gain>div:nth-child(2){animation-delay:.62s}.gain>div:nth-child(3){animation-delay:.74s}
.gain b{display:block;font-family:var(--num);font-size:26px;font-weight:600}
.gain b.w{color:var(--o)}
.gain span{font-size:12px;color:var(--tx2)}
.crewrow{display:flex;justify-content:center;gap:8px;margin:2px 0 4px}
.crewrow>div{width:52px}

/* ---------- rewards (樂運動專區 style) ---------- */
.banner{position:relative;height:178px;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#86DCE5 0%,#4FBFD2 55%,#3AA7C4 100%);color:#fff;padding:18px;margin-bottom:6px}
.banner .stripe{position:absolute;right:-40px;top:0;bottom:0;width:180px;background:rgba(255,255,255,.12);transform:skewX(-18deg)}
.banner .bt{position:relative;font-size:21px;font-weight:800;line-height:1.3;text-shadow:0 1px 0 rgba(0,0,0,.08)}
.banner .bs{position:relative;font-size:13px;margin-top:4px;font-weight:600;color:#08485A}
.banner .bb{position:relative;display:inline-block;margin-top:12px;padding:5px 14px;border-radius:16px;background:linear-gradient(180deg,#FFD24A,#F7A800);color:#7A2E00;font-weight:800;font-size:13px;box-shadow:0 2px 0 #C76B00}
.banner .crew2{position:absolute;right:8px;bottom:8px;display:flex}
.banner .crew2 div{width:50px;margin-left:-8px}
.dots{display:flex;gap:5px;justify-content:center;margin:6px 0 12px}
.dots i{width:6px;height:6px;border-radius:3px;background:#D5D8DE}.dots i.on{width:14px;background:var(--g)}
.sec{font-size:18px;font-weight:700;margin:6px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{text-align:left}
.prod .pimg{aspect-ratio:1;border-radius:12px;padding:5px;background:linear-gradient(135deg,#F4C9B7,#C9C2E8 55%,#A6D7F7)}
.prod .pimg>div{width:100%;height:100%;border-radius:8px;background:#fff;display:grid;place-items:center;position:relative}
.prod .pimg svg{width:62%}
.prod .pimg .badge{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:10px;padding:1px 7px}
.prod b{display:block;font-size:14.5px;font-weight:600;margin-top:8px;line-height:1.35}
.prod .ps{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.price b{margin:0;font-family:var(--num);font-size:22px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:4px}
.price b svg{width:16px}
.price s{font-size:13px;color:var(--tx3)}
.off{display:inline-block;margin-top:4px;font-size:12px;color:var(--red);border:1px solid #F3B6B8;border-radius:4px;padding:0 6px}
.prod .mini{margin-top:8px}
.ticket{background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.ticket .tp{padding:14px;display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,var(--gl),#fff)}
.ticket .tp svg{width:44px;flex:none}
.ticket .tp b{font-size:16.5px;display:block}
.ticket .perf{border-top:2px dashed var(--line);position:relative;margin:0 12px}
.ticket .perf:before,.ticket .perf:after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.ticket .perf:before{left:-21px}.ticket .perf:after{right:-21px}
.ticket .bt{padding:12px 14px 14px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seat{text-align:center;font-size:12px;color:var(--tx2)}
.seat .ring{width:50px;height:50px;margin:0 auto 4px;border-radius:50%;border:2px dashed var(--tx3);position:relative;transition:border-color .3s}
.seat.in .ring{border:2px solid var(--g)}
.seat .ring .av{position:absolute;inset:4px}
.seat .ring .av.dim{opacity:.35;filter:grayscale(1)}
.seat .ring .ok{position:absolute;right:-3px;bottom:-1px;width:18px;height:18px;border-radius:50%;background:var(--g);display:grid;place-items:center;border:2px solid #fff;animation:pop .4s var(--spring)}
.seat .ring .ok svg{width:10px;stroke:#fff;stroke-width:3.4;fill:none}
.code{font-family:var(--num);font-size:30px;font-weight:600;letter-spacing:4px;text-align:center;padding:8px;border-radius:10px;background:var(--gl);color:var(--gd);animation:okpop .5s var(--spring)}
.bars{height:40px;margin:10px 0 0;background:repeating-linear-gradient(90deg,#1F2329 0 2px,transparent 2px 5px,#1F2329 5px 9px,transparent 9px 11px,#1F2329 11px 12px,transparent 12px 15px)}

/* ---------- share ---------- */
.poster-wrap{perspective:900px;margin:4px 0 14px}
.poster{aspect-ratio:9/12.6;border-radius:18px;overflow:hidden;position:relative;transition:transform .15s ease-out;transform-style:preserve-3d;box-shadow:0 14px 30px rgba(14,142,58,.25);background:#fff;display:flex;flex-direction:column}
.poster .ptop{background:linear-gradient(160deg,#1DB954,#0E8E3A);color:#fff;padding:18px 18px 14px;position:relative;overflow:hidden}
.poster .ptop .rings{position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;border:26px solid rgba(255,255,255,.08)}
.poster .pk{font-size:13px;opacity:.9;position:relative}
.poster .pn{font-size:22px;font-weight:800;position:relative}
.poster .big{font-family:var(--num);font-size:110px;font-weight:600;line-height:.9;margin-top:6px;position:relative}
.poster .big small{font-family:var(--font);font-size:17px;font-weight:700;margin-left:6px}
.poster .pb{flex:1;padding:16px 16px 14px;display:flex;flex-direction:column;justify-content:space-between}
.poster .wl{display:block;font-size:11px;color:var(--tx2);margin-top:3px}
.poster .avs{display:flex;justify-content:center;gap:6px}.poster .avs div{width:62px}
.poster .pf{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--tx2)}
.poster .pf .wm{font-size:17px;color:var(--g)}
.poster .qr{width:52px;height:52px;border-radius:6px;background:
  conic-gradient(from 90deg at 30% 30%,#1F2329 25%,transparent 0) 0 0/10px 10px,#fff;border:3px solid #1F2329}
.share3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.share3 button{padding:12px 4px 10px;border-radius:12px;background:#fff;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow)}
.share3 svg{width:28px;height:28px}

/* ---------- me ---------- */
.mehead{background:#fff;padding:6px 16px 18px;display:flex;gap:14px;align-items:center}
.mehead .av{width:64px;height:64px;border-radius:50%;background:var(--gl);padding:5px 6px 0;overflow:hidden}
.mehead b{font-size:19px}
.lvbadge{display:inline-block;font-size:12px;color:var(--g);background:var(--gl);border-radius:10px;padding:1px 8px;margin-top:4px}
.group{background:#fff;border-radius:12px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.group h3{font-size:13px;color:var(--tx2);font-weight:500;padding:12px 14px 4px}
.set{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.set:last-child,.card.set{border-bottom:0}
.set .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.set .si svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.set>div{flex:1}
.set b{display:block;font-size:15px;font-weight:600}
.set p{font-size:12.5px;color:var(--tx2);line-height:1.45}
.tog{width:50px;height:30px;border-radius:15px;background:#E1E3E8;position:relative;flex:none;transition:background .25s}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .3s var(--spring)}
.tog.on{background:var(--g)}.tog.on:after{left:23px}

/* ---------- onboarding ---------- */
.intro{background:linear-gradient(180deg,#1DB954 0%,#14A247 48%,var(--bg) 48.1%)}
.intro .art{position:relative;height:210px;margin:0 -16px}
.intro .art .pl{position:absolute;inset:0}
.intro .art .pl path{stroke-dasharray:720;stroke-dashoffset:720;animation:drawL 1.3s cubic-bezier(.6,0,.3,1) .1s forwards}
@keyframes drawL{to{stroke-dashoffset:0}}
.intro .art .who{position:absolute;width:62px;animation:dropin .7s var(--spring) both}
@keyframes dropin{0%{transform:translateY(-140px) scale(.6);opacity:0}60%{opacity:1}}
.intro .ttl{color:#fff;display:flex;align-items:center;gap:10px;margin-top:-6px}
.intro .ttl .mark{width:40px}
.intro .ttl b{font-size:24px;font-weight:800}
.intro .ttl span{display:block;font-size:13px;opacity:.9}
.intro .seal{width:62px;margin-left:auto;transform:rotate(-10deg);animation:sealslam .5s cubic-bezier(.2,1.5,.4,1) 1.4s both}
@keyframes sealslam{0%{transform:scale(3) rotate(-35deg);opacity:0}60%{transform:scale(.9) rotate(-12deg);opacity:1}100%{transform:rotate(-10deg)}}
.feat{display:flex;gap:12px;align-items:flex-start;padding:10px 0;animation:inFade .5s both}
.feat .fi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.feat .fi svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.feat b{display:block;font-size:15.5px}
.steps3{display:flex;gap:6px;margin:6px 0 10px}
.steps3 i{height:4px;flex:1;border-radius:2px;background:#DDE0E6}.steps3 i.on{background:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{padding:8px 15px;border-radius:18px;background:#fff;font-size:14.5px;box-shadow:inset 0 0 0 1px var(--line);transition:all .2s}
.chip.on{background:var(--gl);color:var(--gd);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--g)}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.opt .art2{width:64px;flex:none;display:flex}
.opt b{display:block;font-size:16.5px;margin-bottom:2px}
.safe{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.safe span{font-size:12.5px;padding:3px 10px;border-radius:12px;background:var(--gl);color:var(--gd);font-weight:600}
.prof{display:flex;gap:12px;align-items:flex-start}
.prof .av{width:54px;flex:none}
.why{display:inline-block;margin-top:6px;font-size:12px;background:#FFF4DC;color:#A05A00;border-radius:6px;padding:2px 8px}
.linkbox{font-family:var(--num);font-size:18px;background:var(--bg);border:1.5px dashed var(--tx3);border-radius:10px;padding:10px;text-align:center;margin:8px 0 12px}
.joined{display:flex;gap:10px;min-height:66px;align-items:flex-end}
.joined .av{width:56px;animation:popin .5s var(--spring) both;animation-delay:var(--d)}
@keyframes popin{from{transform:scale(0) translateY(20px)}}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;background:rgba(15,17,23,.45);display:flex;align-items:flex-end;z-index:30;animation:inFade .2s}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:10px 18px 28px;animation:up .4s cubic-bezier(.2,.9,.3,1.05)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#DDE0E6;margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}}
.push{position:absolute;left:10px;right:10px;top:10px;z-index:40;background:rgba(246,247,250,.94);backdrop-filter:blur(14px);border-radius:20px;padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;gap:11px;align-items:flex-start;text-align:left;animation:drop .55s var(--spring)}
@keyframes drop{from{transform:translateY(-130px)}}
.appicon{width:38px;height:38px;border-radius:9px;background:var(--g);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none;font-family:var(--font)}
.push .hd{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);margin-bottom:1px}
.push b{font-size:14.5px}.push p{font-size:14px;line-height:1.38;color:var(--tx)}
.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:rgba(20,22,30,.82);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;white-space:nowrap;animation:toast 2.3s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.conf{position:absolute;top:-24px;z-index:45;pointer-events:none;animation:fall linear forwards}
.conf svg{width:100%}
@keyframes fall{to{transform:translate(var(--x),880px) rotate(var(--rot))}}
.coinfly{position:absolute;width:24px;z-index:46;pointer-events:none;animation:coinfly .9s cubic-bezier(.5,-.4,.6,1) forwards}
@keyframes coinfly{to{transform:translate(var(--tx),var(--ty)) scale(.6) rotate(360deg);opacity:.2}}
.count{position:absolute;inset:0;z-index:55;display:grid;place-items:center;background:rgba(15,17,23,.75)}

/* ring with 4 segments (one per member) */
function ring(i,state,anim){
 const R=16,L=2*Math.PI*R,today=i===6,track=`<circle cx="20" cy="20" r="${R}" fill="none" stroke="#EAEBF1" stroke-width="3.6"/>`;
 const fill=(col,da,off,a)=>`<circle cx="20" cy="20" r="${R}" fill="none" stroke="${col}" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="${da}" stroke-dashoffset="${off}"${a?` class="seg fill" style="--d:.5s"`:""}/>`;
 if(!sq())return track+(state>=1?fill(state===2?C.o:C.g,`${L.toFixed(2)} 0`,0,anim):"");
 const filled=today?[S.me,S.done.Miko,S.done.Emily,S.done.Jay]:[state>=1,state>=1,state>=1,state>=1];
 const seg=L/4-5.6;let parts=track;
 for(let k=0;k<4;k++)if(filled[k])parts+=fill(state===2&&!today?C.o:C.g,`${seg.toFixed(2)} ${(L-seg).toFixed(2)}`,(-k*L/4-2.8).toFixed(2),anim&&k===0);
 return parts}

/* ---------------- render ---------------- */
function render(dir){
  clearInterval(timer);
  if(["squad","rewards","share"].includes(S.screen)&&!S.joined){S.screen="intro"}
  const html=V[S.screen]();const box=$("screens");
  if(dir&&cur&&!reduced){const old=cur;old.className="screen out-"+dir;setTimeout(()=>old.remove(),340);
    cur=document.createElement("div");cur.className="screen in-"+dir;cur.innerHTML=html;box.appendChild(cur)}
  else{if(!cur){cur=document.createElement("div");box.appendChild(cur)}box.querySelectorAll(".screen").forEach(s=>{if(s!==cur)s.remove()});cur.className="screen";cur.innerHTML=html}
  cur.style.background=S.screen==="play"?"#0F1117":"";
  document.documentElement.lang=S.lang==="zh"?"zh-Hant":"en";
  after();guide();layoutStage();save();fx={};
}
function after(){
  if(S.screen==="play")runTimer();
  if(S.screen==="done")doneSequence();
  if(S.screen==="share")tiltPoster();
  if(S.screen==="courses"&&!reduced){ACTS.forEach((a,i)=>{const f=q("#cf"+i);if(f)f.className="fwrap "+a.moves[0]})}
  if(fx.torn)setTimeout(()=>confetti(36),250);
  const n=q("#coinnum");if(n&&shownCoins!==S.coins)countTo(n,shownCoins,S.coins,()=>{shownCoins=S.coins});
}
function countTo(el,from,to,cb,ms=700,prefix=""){const t0=performance.now();
  const step=n=>{const p=Math.min(1,(n-t0)/ms);el.textContent=prefix+Math.round(from+(to-from)*(1-Math.pow(1-p,3)));p<1?requestAnimationFrame(step):cb&&cb()};requestAnimationFrame(step)}
function guide(){
  const st=(n,k,p,btns)=>`<div class="gstep"><span class="gn">${n}</span><b>${t(k)}</b><p>${t(p)}</p><div class="gbtns">${btns.map(([l,a,g,pk])=>`<button class="gbtn${pk?" pk":""}" data-act="${a}" data-arg="${g||""}">${t(l)}</button>`).join("")}</div></div>`;
  const dual=`<div class="gstep dual"><span class="gn">${I.phones}</span><b>${t("dualT")}</b><p>${t("dualP")}</p><div class="gbtns">
    ${[["gbLine","line"],["gbRec","rec"],["gbIg","ig"]].map(([l,sc])=>`<button class="gbtn${S.dual===sc?" on":" pk"}" data-act="dualGo" data-arg="${sc}">${t(l)}</button>`).join("")}

  const a=S.act,A=ACTS.find(x=>x.id===a.id),total=a.min*60,t0=Date.now(),cues=t(a.cue);let last=0;
  const fb=q("#figbox");fb.className="fwrap "+A.moves[0];
  timer=setInterval(()=>{
    const el=q("#clock");if(!el){clearInterval(timer);return}
    const p=Math.min(1,(Date.now()-t0)/(DEMO_SECONDS*1000)),left=Math.ceil(total*(1-p));
    q("#scrub").style.width=(p*100)+"%";
    el.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    const k=Math.min(cues.length-1,Math.floor(p*cues.length));
    if(k!==last){last=k;const c=q("#cue");c.textContent=cues[k];c.classList.remove("swap");void c.offsetWidth;c.classList.add("swap");

 ${B.typing?Lmsg(`<div class="bub typing"><i></i><i></i><i></i></div>`,"",1):""}</div></div>

 <button class="btn grey" data-b="lockReset">${t("dcBtn")}</button></div></div>`,
joined:()=>`${statusbar("background:var(--bg)")}<div class="body"><div class="pad center" style="padding-top:18px"><div class="okmark">${I.check}</div>
 <div class="h1" style="margin:0 0 4px">${t("jdT")(t("squadName"))}</div><p class="muted">${t("jdB")}</p>
 <div class="crewrow" style="margin:14px 0 12px">${B.members.map((m,i)=>`<div>${blob(m,"cheer",.3+i*.12)}</div>`).join("")}</div>
 <div class="card" style="text-align:left"><div class="set" style="padding:2px 0;border:0"><span class="si" style="background:${C.g}">${I.bell}</span><div><b>${t("rem")}</b><p>${t("jdRem")}</p></div></div></div>
 <div class="card" style="display:flex;gap:10px;align-items:center"><span style="width:28px">${COIN}</span><b style="font-size:15px">${t("jdBonus")}</b></div>
 <button class="btn" data-b="squad" style="margin-top:4px">${t("jdBtn")}</button></div></div>`,
bsquad:()=>{const M=B.scen==="line"&&B.members.length===4,n=B.members.length,ok=w=>M&&(w==="You"?S.me:S.done[w]),d=B.members.filter(ok).length;return `${statusbar("background:#fff")}<div class="wbar"><span></span><h1>${t("spTitle")}</h1><span></span></div>
 <div class="body"><div class="shero"><div class="rings"></div><div class="sqname">${t("squadName")}</div><div class="sub">${M?t("bsSub2")(d,n):t("bsSub")(n)}</div>
  <div class="stagecrew"><svg class="line" viewBox="0 0 360 40" preserveAspectRatio="none" height="40"><path d="M0 34H120L132 14L144 34L156 4L168 34H360" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" opacity=".35"/><path class="beat" d="M0 34H120L132 14L144 34L156 4L168 34H360" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
   ${B.members.map((w,i)=>{const me=w===B.who,x=n>1?i/(n-1):.5,o=ok(w),wt=me&&!o;return `<div class="mate" style="left:calc((100% - 58px) * ${x})">${wt?`<div class="bubble">${t("yourTurnB")}</div>`:""}${blob(w,wt?"wait":o?"happy":"idle",i*.15)}${o?`<span class="tick"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>`:""}<span class="nm">${me?t("you"):w==="You"?HOST:w}</span></div>`}).join("")}</div>
  <div class="glass"><div>${t("sStreak")}<b>${M?S.streak:0}</b><small>${t("dayU")}</small></div><div>${t("sToday")}<b>${d}</b><small>/${n}${t("people")}</small></div><div>${t("sChest")}<b>${M?Math.min(S.chest,200):20}</b><small>/200</small></div></div></div>
 <div class="pad" style="padding-top:12px"><div class="card lb"><div class="ct"><b>${t("planT")}</b><span class="tag">${t("free")}</span></div><div class="muted" style="color:${C.g}">${t("planSub")(M?S.day:1)}</div>
  <button class="btn" data-b="nope" style="margin-top:12px">${t("go")}</button></div></div></div>${navB()}`},
story:()=>`<div class="body story">${statusbar("color:#fff")}<div class="sbar"><i class="done"></i><i class="on"></i></div>
 <div class="shd"><div class="sav"><div>${blob("You","happy")}</div></div><b>${HOST}</b><span style="opacity:.65">${t("stTime")}</span><svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
 <div class="sframe"><div class="pscale">${posterHTML()}</div><button class="sticker" data-b="open">${I.lnk}${t("stLink")}</button></div>
 <div class="sfoot"><span>${t("stReply")}</span>${I.heart}${I.send}</div></div>`,
land:()=>`${statusbar("color:#fff;background:#1DB954")}<div class="body"><div class="shero" style="padding-bottom:22px"><div class="rings"></div>
 <div class="sub" style="margin:0">${t("lnK")}</div><div class="sqname" style="font-size:22px;line-height:1.4">${t("lnT")(S.streak)}</div>
 <div class="jcrew">${["You","Miko","Emily","Jay"].map((m,i)=>`<div><div class="jav">${blob(m,"happy",i*.2)}</div>${m==="You"?HOST:m}</div>`).join("")}</div></div>
 <div class="pad" style="padding-top:12px"><div class="card" style="padding:6px 14px 8px"><p style="margin:10px 0 2px;font-size:14px;line-height:1.6">${t("lnB")}</p>${FEATS()}</div></div></div>
 <div class="footbar"><button class="btn" data-b="create">${t("lnNew")}</button><button class="btn ghost" data-b="nope" style="margin-top:8px">${t("lnTry")}</button></div>`,
created:()=>`${statusbar("background:var(--bg)")}<div class="body"><div class="pad center" style="padding-top:18px"><div class="okmark">${I.check}</div>
 <div class="h1" style="margin:0 0 4px">${t("crT")}</div><p class="muted">${t("crB")}</p>
 <div class="card" style="text-align:left;margin-top:16px"><div class="row"><b class="h2">${t("crName")(B.who)}</b><span class="muted">1/5</span></div>
  <div style="display:flex;gap:6px;margin:10px 0 2px"><div style="width:46px">${blob(B.who,"happy")}</div>${[1,2,3].map(()=>`<div style="width:42px;height:42px;margin-top:4px;border-radius:50%;border:2px dashed var(--tx3)"></div>`).join("")}</div>
  <div class="linkbox">squadpulse.demo/squad/KAI-2730</div><div class="share3"><button data-b="nope">${I.line}LINE</button><button data-b="nope">${I.ig}Instagram</button><button data-b="nope">${I.lk}${t("copyL")}</button></div></div>
 <div class="card" style="display:flex;gap:10px;align-items:center;text-align:left"><span style="width:28px;flex:none">${COIN}</span><b style="font-size:15px">${t("crBonus")}</b></div></div></div>`
};
function renderB(dir){if(!B)return;clearTimeout(timerB);const html=VB[B.screen](),box=$("screensB");
  if(dir&&curB&&!reduced){const old=curB;old.className="screen out-"+dir;setTimeout(()=>old.remove(),340);
    curB=document.createElement("div");curB.className="screen in-"+dir;curB.innerHTML=html;box.appendChild(curB)}
  else{if(!curB){curB=document.createElement("div");box.appendChild(curB)}box.querySelectorAll(".screen").forEach(x=>{if(x!==curB)x.remove()});curB.className="screen";curB.innerHTML=html}
  if(fxB.conf)setTimeout(()=>confetti(40,$("phoneB")),350);
  const rb=qB("#rchatBody");if(rb)rb.scrollTop=rb.scrollHeight;
  fxB={};guide();layoutStage()}
function notifyB(n){if(!B)return;B.notif=n;B.screen="lock";fxB.drop=true;renderB("fade");shake($("phoneB"));if(small()){toast(t("mNew")(B.who));setTimeout(()=>setView("B"),900)}}
function acceptA(n,via){if(B&&n===B.who)toA();S.pend=S.pend.filter(x=>x!==n);if(!S.invited.includes(n))S.invited.push(n);fx.pop=n;
  if(["ob4ff","ob4rec"].includes(S.screen))render();else save();toast(t("joinedVia")(n,t("via_"+via)));
  if(B&&B.scen==="line"&&n!==B.who&&!B.members.includes(n)){B.members.push(n);if(["joined","bsquad"].includes(B.screen))renderB();else guide()}}
function declineA(n){toA();S.pend=S.pend.filter(x=>x!==n);if(!S.busy.includes(n))S.busy.push(n);if(S.screen==="ob4rec")render();toast(t("busyToast")(n))}
function refA(){toA();S.coins+=20;render();toast(t("refBonus")(B.who))}
const BA={
 notif:()=>{const app=B.notif.app;B.notif=null;B.screen={line:"chat",wl:"req",ig:"story"}[app];renderB("fade")},
 back:s=>{B.screen=s;renderB("back")},
 open:()=>{B.screen="open";renderB("fade");timerB=setTimeout(()=>{if(B&&B.screen==="open"){B.screen=B.scen==="ig"?"land":"join";renderB("fwd")}},1500)},
 join:()=>{if(!B.members.includes(B.who))B.members.push(B.who);B.screen="joined";fxB.conf=true;renderB("fwd");
   setTimeout(()=>fly("BA","ok"),450);const via=B.scen;
   setTimeout(()=>{acceptA(B.who,via);if(via==="line")S.lineSel.filter(n=>n!==B.who&&n!=="fam").forEach((n,i)=>setTimeout(()=>acceptA(n,"line"),1700+i*1600))},1450)},
 chat:()=>{B.screen="rchat";renderB("fwd")},
 reply:i=>{B.chat.push({me:1,i:+i});B.typing=true;renderB();setTimeout(()=>{if(!B)return;B.typing=false;B.chat.push({me:0,i:+i});if(B.screen==="rchat")renderB()},1500)},
 decline:()=>{B.screen="declined";renderB("fwd");setTimeout(()=>fly("BA","no"),350);setTimeout(()=>declineA(B.who),1350)},
 squad:()=>{B.screen="bsquad";renderB("fwd")},
 create:()=>{B.screen="created";fxB.conf=true;renderB("fwd");setTimeout(()=>fly("BA","ok"),450);setTimeout(refA,1450)},
 lockReset:()=>{B.screen="lock";renderB("fade")},
 nope:()=>toast(t("nopeB"),$("phoneB"))
};
function hintIdx(){const s=B.screen,n=!!B.notif;
  if(S.dual==="line"){if(s==="lock")return n?1:0;if(s==="chat")return 2;if(s==="open"||s==="join")return 3;return S.invited.length>=S.lineSel.filter(x=>x!=="fam").length?5:4}
  if(S.dual==="rec"){if(s==="lock")return n?1:S.busy.includes(B.who)?5:0;if(s==="req")return 2;if(s==="rchat")return 3;if(s==="declined")return 5;return 4}
  if(s==="lock")return n?1:0;if(s==="story")return 2;if(s==="open"||s==="land")return 3;return 4}
function lineSheet(still){return `<div class="ov${still?" still":""}"><div class="sheet"><div class="grab"></div><div class="sheethd"><span>${I.line}</span>${t("lineSheetT")}</div>
  ${["Miko","Emily","Jay","fam"].map(n=>`<button class="lrow" data-act="lineTog" data-arg="${n}"><div class="av">${n==="fam"?I.grp:blob(n,"idle")}</div><b>${n==="fam"?t("famGroup"):n}</b><i class="ck${S.lineSel.includes(n)?" on":""}">${I.check}</i></button>`).join("")}
  <button class="btn" style="margin-top:14px;background:#06C755;box-shadow:none" ${S.lineSel.length?"":"disabled"} data-act="lineSend">${t("lineSend")(S.lineSel.length)}</button></div></div>`}
function igSheet(){return `<div class="ov"><div class="sheet center"><div class="grab"></div><div class="sheethd" style="justify-content:center"><span>${I.ig}</span>${t("igSheetT")}</div>
  <div class="igprev"><div class="pscale">${posterHTML()}</div><span class="sticker">${I.lnk}${t("stLink")}</span></div>
  <p class="muted" style="margin-bottom:14px">${t("igSheetB")}</p><button class="btn" data-act="igPost">${t("igPost")}</button><button class="btn grey" data-act="close" style="margin-top:8px">${t("cancel")}</button></div></div>`}
const FLYI={line:()=>I.line,ig:()=>I.ig,wl:()=>I.wl,ok:()=>I.check,no:()=>I.close};
function fly(dir,kind){if(reduced||!B||small())return;const st=$("stage"),sr=st.getBoundingClientRect(),a=$("phone").getBoundingClientRect(),b=$("phoneB").getBoundingClientRect();
  const PA={x:a.left+a.width*.5,y:a.top+a.height*.45},PB={x:b.left+b.width*.5,y:b.top+b.height*.36};
  const [p0,p1]=dir==="AB"?[PA,PB]:[PB,PA],c={x:(p0.x+p1.x)/2,y:Math.min(p0.y,p1.y)-170};
  const el=document.createElement("div");el.className="fly "+kind;el.innerHTML=FLYI[kind]();st.appendChild(el);
  const kf=[];for(let i=0;i<=20;i++){const u=i/20,x=(1-u)**2*p0.x+2*(1-u)*u*c.x+u*u*p1.x-sr.left-24,y=(1-u)**2*p0.y+2*(1-u)*u*c.y+u*u*p1.y-sr.top-24;
    kf.push({transform:`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${u<.15?.3+u*4.7:u>.85?1-(u-.85)*3:1})`,opacity:u<.04||u>.98?0:1})}
  el.animate(kf,{duration:1050,easing:"cubic-bezier(.45,0,.35,1)"}).onfinish=()=>el.remove()}
function layoutStage(){const st=$("stage"),d=!!(S.dual&&B);st.classList.toggle("dual",d);
  const cols=st.querySelectorAll(".pcol");cols[0].classList.toggle("on",!d||VIEW==="A");cols[1].classList.toggle("on",d&&VIEW==="B");
  $("labA").innerHTML=`<div>${blob("You","happy")}</div>${t("labA")}`;if(d)$("labB").innerHTML=`<div>${blob(B.who,"happy")}</div>${t("labB")(B.who)}`;
  let z=1;if(innerWidth>820){const g=st.querySelector(".guide"),gw=(g.offsetWidth||330)+(d?32:48),pw=d?2*414+56:414,ph=836+(d?50:0);
    z=Math.max(.45,Math.min(1,(innerWidth-48-gw)/pw,(innerHeight-48)/ph))}
  if(Math.abs(z-ZOOM)>.001||!st.dataset.z){st.querySelectorAll(".pcol").forEach(p=>p.style.zoom=z);ZOOM=z;st.dataset.z=1}}
addEventListener("resize",()=>{ZOOM=0;layoutStage()});
document.addEventListener("click",e=>{const el=e.target.closest("[data-b]");if(!el||el.disabled||!B)return;const f=BA[el.dataset.b];if(f)f(el.dataset.arg)});
function newDay(){S.week=[...S.week.slice(1),0];S.me=false;S.done={Miko:true,Emily:true,Jay:true};S.bonus=0;S.dealIn=false;S.dealJay=false;S.day+=1}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=A[el.dataset.act];const inMenu=el.closest("#mmenu")&&el.dataset.act!=="menu";if(inMenu){const mm=$("mmenu");mm.classList.remove("open");mm.innerHTML=""}if(f)f(el.dataset.arg)});
setInterval(()=>{[cur,curB].forEach(c=>{const s=c&&c.querySelector(".status span");if(s)s.textContent=clock()});const l=qB("#lktime");if(l)l.textContent=clock()},15000);
function welcome(){const m=small()?1:0;$("welcomeBox").innerHTML=`<div class="welcome"><div class="wcard"><div class="mk">${MARKG}</div><h2>${t("wT")}</h2><p class="wsub">${t("wSub")}</p>
 <ul>${t("wL").map((l,i)=>`<li><i>${i+1}</i><span>${l[m]}</span></li>`).join("")}</ul>
 <div class="wrow"><button class="btn" data-act="welcomeGo">${t("wGo")}</button><button class="btn grey" data-act="welcomeLang" style="flex:0 0 auto;width:auto;padding:13px 18px">${t("gLang")}</button></div></div></div>`}
render();
try{if(!localStorage.getItem("sp-welcome"))welcome()}catch(e){welcome()}
